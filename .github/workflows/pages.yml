name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site and downloadable zip
        run: |
          mkdir -p _site/football-blitz
          cp -r index.html manifest.webmanifest sw.js .nojekyll css js assets _site/
          cp -r index.html manifest.webmanifest css js assets _site/football-blitz/
          cp README.md _site/football-blitz/
          (cd _site && zip -qr football-blitz.zip football-blitz && rm -rf football-blitz)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
